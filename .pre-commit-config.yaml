# See https://pre-commit.com for more information
repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Ruff linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Main branch protection (pre-commit)
  - repo: local
    hooks:
      - id: prevent-commit-to-main
        name: Prevent commits to main branch
        entry: bash -c 'if [ "$(git branch --show-current)" = "main" ]; then echo "ERROR: Direct commits to main branch are not allowed. Create a feature branch instead."; exit 1; fi'
        language: system
        stages: [commit]
        always_run: true
        pass_filenames: false

  # Test execution (pre-push only)
  - repo: local
    hooks:
      - id: run-tests
        name: Run pytest tests
        entry: bash -c 'if command -v pytest &> /dev/null; then pytest tests/ || exit 1; else echo "WARNING: pytest not found, skipping tests"; fi'
        language: system
        stages: [push]
        always_run: true
        pass_filenames: false

      - id: prevent-push-to-main
        name: Prevent pushes to main branch
        entry: bash -c 'if [ "$(git branch --show-current)" = "main" ]; then echo "ERROR: Direct pushes to main branch are not allowed. Use pull requests instead."; exit 1; fi'
        language: system
        stages: [push]
        always_run: true
        pass_filenames: false
